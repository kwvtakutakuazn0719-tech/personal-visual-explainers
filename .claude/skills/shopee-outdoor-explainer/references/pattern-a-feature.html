<!DOCTYPE html>
<!--
  PATTERN A: Feature Deep-Dive
  Use for: Single-product items where technology/materials are the main differentiator.
  Examples: Running shoes, technical apparel, specialized single-piece gear.
  
  STRUCTURE:
  1. Hero (brand, name, tagline, Best-for pills)
  2. Product image + 3 key feature cards (detailed) + spec number badges
  3. Material/component summary (3-col)
  4. Size guide or fit notes
  5. Footer
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title><!-- PRODUCT NAME --></title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sp: {
              bg: '#FFFFFF', surface: '#F9FAFB', card: '#F3F4F6',
              border: '#E5E7EB', text: '#111827', muted: '#6B7280',
              dim: '#9CA3AF', dark: '#1F2937', positive: '#059669',
              warning: '#D97706', blue: '#1D4ED8',
              'blue-light': '#EFF6FF', 'blue-mid': '#DBEAFE',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-sp-bg text-sp-text antialiased" style="width:800px; margin:0; padding:0;">
<div style="width:800px;">
<div class="border-t-4 border-sp-dark">
<div class="px-8 pt-7 pb-8">

<!-- 1. HERO -->
<div class="flex items-start justify-between mb-5">
  <div>
    <div class="flex items-center gap-2 mb-2">
      <span class="bg-sp-dark text-white text-xs font-bold tracking-widest px-3 py-1 rounded-sm uppercase"><!-- BRAND --></span>
      <span class="text-sp-muted text-xs font-medium uppercase tracking-wide"><!-- CATEGORY --></span>
    </div>
    <h1 class="text-3xl font-black text-sp-text leading-none tracking-tight"><!-- PRODUCT NAME --></h1>
    <p class="text-sp-muted text-xs mt-1.5"><!-- ONE-LINE TAGLINE --></p>
  </div>
  <div class="w-12 h-12 bg-sp-surface border border-sp-border rounded-xl flex items-center justify-center flex-shrink-0 ml-4">
    <i data-lucide="<!-- ICON -->" class="w-6 h-6 text-sp-dark"></i>
  </div>
</div>

<!-- Best-for pills -->
<div class="flex flex-wrap gap-1.5 mb-6">
  <!-- Repeat for each tag (max 4) -->
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 1 -->
  </span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 2 -->
  </span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 3 -->
  </span>
</div>

<div class="border-t border-sp-border mb-6"></div>

<!-- 2. PRODUCT IMAGE + KEY FEATURES + SPEC BADGES -->
<div class="flex gap-5 mb-6">

  <!-- Product Image -->
  <div class="flex-shrink-0 w-60 bg-sp-surface border border-sp-border rounded-xl overflow-hidden flex items-center justify-center" style="min-height:220px;">
    <img src="<!-- IMAGE URL -->" alt="<!-- ALT TEXT -->"
      class="w-full h-full object-contain p-2" style="max-height:260px;"
      onerror="this.style.display='none'; this.parentElement.innerHTML='<p class=\'text-xs text-sp-dim p-4 text-center\'>Image not available</p>';">
  </div>

  <!-- Features + Spec Badges -->
  <div class="flex-1 flex flex-col gap-3">

    <!-- 3 feature cards — use different background colors for visual variety -->
    <div class="space-y-2">
      <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-amber-800"><!-- FEATURE 1 TITLE --></p>
          <p class="text-xs text-amber-700"><!-- FEATURE 1 DESCRIPTION --></p>
        </div>
      </div>
      <div class="flex items-start gap-3 bg-sp-blue-light border border-sp-blue-mid rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-blue flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-blue-800"><!-- FEATURE 2 TITLE --></p>
          <p class="text-xs text-blue-700"><!-- FEATURE 2 DESCRIPTION --></p>
        </div>
      </div>
      <div class="flex items-start gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-green-700 flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-green-800"><!-- FEATURE 3 TITLE --></p>
          <p class="text-xs text-green-700"><!-- FEATURE 3 DESCRIPTION --></p>
        </div>
      </div>
    </div>

    <!-- Spec number badges (3–4 key numbers) -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-xl font-black text-white leading-none"><!-- NUM --><span class="text-sm text-gray-400"><!-- UNIT --></span></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-xl font-black text-white leading-none"><!-- NUM --><span class="text-sm text-gray-400"><!-- UNIT --></span></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-xl font-black text-white leading-none"><!-- NUM --><span class="text-sm text-gray-400"><!-- UNIT --></span></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
    </div>

  </div>
</div>

<!-- 3. MATERIAL / COMPONENT SUMMARY (3-col) -->
<div class="grid grid-cols-3 gap-3 mb-6">
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- PART 1 (e.g. Upper) --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- PART 2 --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- PART 3 --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
</div>

<!-- 4. SIZE GUIDE (omit if not applicable) -->
<div class="bg-sp-surface border border-sp-border rounded-xl overflow-hidden mb-6">
  <div class="px-4 py-2.5 border-b border-sp-border flex items-center gap-2">
    <i data-lucide="ruler" class="w-4 h-4 text-sp-muted"></i>
    <span class="text-xs font-bold text-sp-text">Size Guide</span>
    <span class="text-xs text-sp-muted ml-1">— <!-- FIT NOTE e.g. True to size. Between sizes? Go up. --></span>
  </div>
  <!-- Size table rows here — US / UK / EUR / CM columns -->
  <div class="grid grid-cols-4 bg-sp-dark px-4 py-2">
    <div class="text-xs font-bold text-gray-400 text-center">US</div>
    <div class="text-xs font-bold text-gray-400 text-center">UK</div>
    <div class="text-xs font-bold text-gray-400 text-center">EUR</div>
    <div class="text-xs font-bold text-gray-400 text-center">CM</div>
  </div>
  <!-- Sample row (repeat as needed) -->
  <div class="grid grid-cols-4 px-4 py-2 border-b border-sp-border text-center text-xs">
    <div class="font-semibold"><!-- US --></div>
    <div class="text-sp-muted"><!-- UK --></div>
    <div class="text-sp-muted"><!-- EUR --></div>
    <div class="text-sp-muted"><!-- CM --></div>
  </div>
</div>

<!-- 5. FOOTER -->
<div class="flex items-center justify-between">
  <div class="flex items-center gap-1.5 text-xs text-sp-muted">
    <i data-lucide="package" class="w-3.5 h-3.5"></i>
    Genuine Product · Ships from Japan
  </div>
  <div class="text-xs text-sp-dim"><!-- SOURCE URL e.g. newbalance.com --></div>
</div>

</div>
</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
