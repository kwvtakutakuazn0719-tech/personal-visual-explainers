<!DOCTYPE html>
<!--
  PATTERN C: Activity Guide
  Use for: Versatile/lifestyle products where the buyer's question is "does this fit MY activity?"
  Examples: Hiking jackets, trail vests, camp chairs, trekking poles, multi-purpose footwear.

  STRUCTURE:
  1. Hero (brand, name, tagline, Best-for pills)
  2. Product image + 3 "Who it's for" activity scenario cards
  3. Feature highlights (4-col compact grid)
  4. Material / tech summary (3-col)
  5. Footer
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title><!-- PRODUCT NAME --></title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sp: {
              bg: '#FFFFFF', surface: '#F9FAFB', card: '#F3F4F6',
              border: '#E5E7EB', text: '#111827', muted: '#6B7280',
              dim: '#9CA3AF', dark: '#1F2937', positive: '#059669',
              warning: '#D97706', blue: '#1D4ED8',
              'blue-light': '#EFF6FF', 'blue-mid': '#DBEAFE',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-sp-bg text-sp-text antialiased" style="width:800px; margin:0; padding:0;">
<div style="width:800px;">
<div class="border-t-4 border-sp-dark">
<div class="px-8 pt-7 pb-8">

<!-- 1. HERO -->
<div class="flex items-start justify-between mb-5">
  <div>
    <div class="flex items-center gap-2 mb-2">
      <span class="bg-sp-dark text-white text-xs font-bold tracking-widest px-3 py-1 rounded-sm uppercase"><!-- BRAND --></span>
      <span class="text-sp-muted text-xs font-medium uppercase tracking-wide"><!-- CATEGORY --></span>
    </div>
    <h1 class="text-3xl font-black text-sp-text leading-none tracking-tight"><!-- PRODUCT NAME --></h1>
    <p class="text-sp-muted text-xs mt-1.5"><!-- TAGLINE — emphasize versatility and range of use --></p>
  </div>
  <div class="w-12 h-12 bg-sp-surface border border-sp-border rounded-xl flex items-center justify-center flex-shrink-0 ml-4">
    <i data-lucide="<!-- ICON -->" class="w-6 h-6 text-sp-dark"></i>
  </div>
</div>

<!-- Best-for pills -->
<div class="flex flex-wrap gap-1.5 mb-6">
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 1 --></span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 2 --></span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 3 --></span>
</div>

<div class="border-t border-sp-border mb-6"></div>

<!-- 2. PRODUCT IMAGE + "WHO IT'S FOR" ACTIVITY SCENARIOS -->
<div class="flex gap-5 mb-6">

  <div class="flex-shrink-0 w-56 bg-sp-surface border border-sp-border rounded-xl overflow-hidden flex items-center justify-center" style="min-height:240px;">
    <img src="<!-- IMAGE URL -->" alt="<!-- ALT -->"
      class="w-full h-full object-contain p-2" style="max-height:280px;"
      onerror="this.style.display='none'; this.parentElement.innerHTML='<p class=\'text-xs text-sp-dim p-4 text-center\'>Image not available</p>';">
  </div>

  <!-- 3 activity scenario cards — each describes a type of user/situation -->
  <div class="flex-1 flex flex-col gap-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-widest">Who It's For</p>

    <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
      <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
        <i data-lucide="<!-- ICON e.g. mountain -->" class="w-4 h-4 text-amber-600"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-amber-800"><!-- SCENARIO 1 TITLE e.g. Weekend Hiker --></p>
        <p class="text-xs text-amber-700"><!-- 1–2 sentences: what this person needs and how the product fits --></p>
      </div>
    </div>

    <div class="flex items-start gap-3 bg-sp-blue-light border border-sp-blue-mid rounded-xl px-4 py-3">
      <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
        <i data-lucide="<!-- ICON e.g. zap -->" class="w-4 h-4 text-sp-blue"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-blue-800"><!-- SCENARIO 2 TITLE e.g. Trail Runner --></p>
        <p class="text-xs text-blue-700"><!-- DESCRIPTION --></p>
      </div>
    </div>

    <div class="flex items-start gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
      <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
        <i data-lucide="<!-- ICON e.g. tent -->" class="w-4 h-4 text-green-700"></i>
      </div>
      <div>
        <p class="text-xs font-bold text-green-800"><!-- SCENARIO 3 TITLE e.g. Casual Camper --></p>
        <p class="text-xs text-green-700"><!-- DESCRIPTION --></p>
      </div>
    </div>
  </div>
</div>

<!-- 3. FEATURE HIGHLIGHTS (4-col compact) -->
<div class="grid grid-cols-4 gap-3 mb-6">
  <!-- Repeat 4 times -->
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3 text-center">
    <div class="w-8 h-8 bg-sp-card border border-sp-border rounded-lg flex items-center justify-center mx-auto mb-2">
      <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-dark"></i>
    </div>
    <p class="text-xs font-bold text-sp-text mb-0.5"><!-- FEATURE TITLE --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESC --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3 text-center">
    <div class="w-8 h-8 bg-sp-card border border-sp-border rounded-lg flex items-center justify-center mx-auto mb-2">
      <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-dark"></i>
    </div>
    <p class="text-xs font-bold text-sp-text mb-0.5"><!-- FEATURE TITLE --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESC --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3 text-center">
    <div class="w-8 h-8 bg-sp-card border border-sp-border rounded-lg flex items-center justify-center mx-auto mb-2">
      <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-dark"></i>
    </div>
    <p class="text-xs font-bold text-sp-text mb-0.5"><!-- FEATURE TITLE --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESC --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3 text-center">
    <div class="w-8 h-8 bg-sp-card border border-sp-border rounded-lg flex items-center justify-center mx-auto mb-2">
      <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-dark"></i>
    </div>
    <p class="text-xs font-bold text-sp-text mb-0.5"><!-- FEATURE TITLE --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESC --></p>
  </div>
</div>

<!-- 4. MATERIAL / TECH SUMMARY (3-col) -->
<div class="grid grid-cols-3 gap-3 mb-6">
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- COMPONENT 1 --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL/TECH NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- COMPONENT 2 --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL/TECH NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
  <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
    <p class="text-xs font-bold text-sp-muted uppercase tracking-wider mb-1.5"><!-- COMPONENT 3 --></p>
    <p class="text-xs font-semibold text-sp-text mb-0.5"><!-- MATERIAL/TECH NAME --></p>
    <p class="text-xs text-sp-muted"><!-- SHORT DESCRIPTION --></p>
  </div>
</div>

<!-- 5. FOOTER -->
<div class="flex items-center justify-between">
  <div class="flex items-center gap-1.5 text-xs text-sp-muted">
    <i data-lucide="package" class="w-3.5 h-3.5"></i>
    Genuine Product · Ships from Japan
  </div>
  <div class="text-xs text-sp-dim"><!-- SOURCE URL --></div>
</div>

</div>
</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
