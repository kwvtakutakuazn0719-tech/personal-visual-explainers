<!DOCTYPE html>
<!--
  PATTERN B: Lineup Navigator
  Use for: Products with multiple variants where "which model is right for me?" is the key buyer question.
  Examples: Fishing reels (PG/HG/XG), multi-model electronics, tent/sleeping bag size/spec variants.

  STRUCTURE:
  1. Hero (series name, category, tagline, Best-for pills)
  2. Product image + 3 shared key features + shared spec badges
  3. Model comparison table (3–6 models: spec / weight / use case)
  4. Customer reviews (3 quotes)
  5. Technology pills
  6. Footer
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title><!-- SERIES NAME --></title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sp: {
              bg: '#FFFFFF', surface: '#F9FAFB', card: '#F3F4F6',
              border: '#E5E7EB', text: '#111827', muted: '#6B7280',
              dim: '#9CA3AF', dark: '#1F2937', positive: '#059669',
              warning: '#D97706', blue: '#1D4ED8',
              'blue-light': '#EFF6FF', 'blue-mid': '#DBEAFE',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-sp-bg text-sp-text antialiased" style="width:800px; margin:0; padding:0;">
<div style="width:800px;">
<div class="border-t-4 border-sp-dark">
<div class="px-8 pt-7 pb-8">

<!-- 1. HERO -->
<div class="flex items-start justify-between mb-5">
  <div>
    <div class="flex items-center gap-2 mb-2">
      <span class="bg-sp-dark text-white text-xs font-bold tracking-widest px-3 py-1 rounded-sm uppercase"><!-- BRAND --></span>
      <span class="text-sp-muted text-xs font-medium uppercase tracking-wide"><!-- CATEGORY + "Series" --></span>
    </div>
    <h1 class="text-3xl font-black text-sp-text leading-none tracking-tight"><!-- SERIES NAME --></h1>
    <p class="text-sp-muted text-xs mt-1.5"><!-- TAGLINE describing the whole series --></p>
  </div>
  <div class="w-12 h-12 bg-sp-surface border border-sp-border rounded-xl flex items-center justify-center flex-shrink-0 ml-4">
    <i data-lucide="<!-- ICON -->" class="w-6 h-6 text-sp-dark"></i>
  </div>
</div>

<!-- Best-for pills -->
<div class="flex flex-wrap gap-1.5 mb-6">
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 1 -->
  </span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 2 -->
  </span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 3 -->
  </span>
  <span class="inline-flex items-center gap-1 bg-sp-surface border border-sp-border text-sp-text text-xs font-semibold px-2.5 py-1 rounded-full">
    <i data-lucide="check-circle-2" class="w-3 h-3 text-sp-positive"></i><!-- TAG 4 -->
  </span>
</div>

<div class="border-t border-sp-border mb-6"></div>

<!-- 2. PRODUCT IMAGE + SHARED FEATURES + SHARED SPEC BADGES -->
<div class="flex gap-5 mb-6">

  <div class="flex-shrink-0 w-60 bg-sp-surface border border-sp-border rounded-xl overflow-hidden flex items-center justify-center" style="min-height:220px;">
    <img src="<!-- IMAGE URL -->" alt="<!-- ALT -->"
      class="w-full h-full object-contain p-3" style="max-height:260px;"
      onerror="this.style.display='none'; this.parentElement.innerHTML='<p class=\'text-xs text-sp-dim p-4 text-center\'>Image not available</p>';">
  </div>

  <div class="flex-1 flex flex-col gap-3">
    <!-- 3 features shared across ALL models in the series -->
    <div class="space-y-2">
      <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-amber-800"><!-- SHARED FEATURE 1 --></p>
          <p class="text-xs text-amber-700"><!-- DESCRIPTION --></p>
        </div>
      </div>
      <div class="flex items-start gap-3 bg-sp-blue-light border border-sp-blue-mid rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-sp-blue flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-blue-800"><!-- SHARED FEATURE 2 --></p>
          <p class="text-xs text-blue-700"><!-- DESCRIPTION --></p>
        </div>
      </div>
      <div class="flex items-start gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
        <i data-lucide="<!-- ICON -->" class="w-4 h-4 text-green-700 flex-shrink-0 mt-0.5"></i>
        <div>
          <p class="text-xs font-bold text-green-800"><!-- SHARED FEATURE 3 --></p>
          <p class="text-xs text-green-700"><!-- DESCRIPTION --></p>
        </div>
      </div>
    </div>

    <!-- Shared spec badges (values common to all or the range) -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-sm font-black text-white leading-none"><!-- SHARED SPEC 1 --></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-sm font-black text-white leading-none"><!-- RANGE e.g. 11–16kg --></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
      <div class="bg-sp-dark rounded-xl py-3 text-center">
        <p class="text-sm font-black text-white leading-none"><!-- MODELS e.g. 4000–10000 --></p>
        <p class="text-xs text-gray-400 mt-1"><!-- LABEL --></p>
      </div>
    </div>
  </div>
</div>

<!-- 3. MODEL COMPARISON TABLE -->
<!-- Header row label should match the product type (e.g., for reels: Model / Gear Ratio / Max Drag / Weight / Best For) -->
<div class="bg-sp-surface border border-sp-border rounded-xl overflow-hidden mb-2">
  <div class="px-4 py-2.5 border-b border-sp-border flex items-center gap-2 bg-sp-card">
    <i data-lucide="list" class="w-4 h-4 text-sp-muted"></i>
    <span class="text-xs font-bold text-sp-text"><!-- TABLE TITLE e.g. Model Lineup — Choose by Use Case --></span>
  </div>
  <!-- Column headers — customize for product type -->
  <div class="grid grid-cols-5 px-4 py-2 bg-sp-dark text-xs font-bold text-gray-400 text-center">
    <div class="text-left"><!-- COL 1 e.g. Model --></div>
    <div><!-- COL 2 e.g. Gear Ratio --></div>
    <div><!-- COL 3 e.g. Max Drag --></div>
    <div><!-- COL 4 e.g. Weight --></div>
    <div><!-- COL 5 e.g. Best For --></div>
  </div>
  <!-- Data rows — highlight the "recommended" row with sp-blue text -->
  <!-- Row pattern: alternate bg-white / transparent -->
  <div class="grid grid-cols-5 px-4 py-2.5 border-b border-sp-border text-xs text-center items-center">
    <div class="text-left font-semibold text-sp-text"><!-- MODEL A --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted text-left"><!-- USE CASE --></div>
  </div>
  <div class="grid grid-cols-5 px-4 py-2.5 border-b border-sp-border text-xs text-center items-center bg-white">
    <div class="text-left font-semibold text-sp-text"><!-- MODEL B --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted"><!-- VAL --></div>
    <div class="text-sp-muted text-left"><!-- USE CASE --></div>
  </div>
  <!-- Add more rows as needed (max ~6 for readability) -->
</div>
<!-- Legend row if needed -->
<div class="flex justify-end mb-5">
  <p class="text-xs text-sp-dim"><!-- LEGEND e.g. PG = Power Gear · HG = High Gear · XG = Extra High Gear --></p>
</div>

<!-- 4. CUSTOMER REVIEWS -->
<div class="mb-6">
  <div class="flex items-center gap-2 mb-3">
    <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
    <span class="text-xs font-bold text-sp-text">What Verified Buyers Are Saying</span>
    <span class="text-xs text-sp-dim ml-1">— <!-- SOURCE e.g. Amazon.co.jp · 202 ratings · 4.2 ★ --></span>
  </div>
  <div class="grid grid-cols-3 gap-3">
    <!-- Review card — repeat 3 times -->
    <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
      <div class="flex gap-1 mb-2">
        <!-- Star icons: fill-amber-400 for filled, text-gray-300 for empty -->
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
      </div>
      <p class="text-xs font-semibold text-sp-text mb-1">"<!-- HEADLINE -->"</p>
      <p class="text-xs text-sp-muted"><!-- BODY (1–2 sentences summarizing a real review) --></p>
    </div>
    <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
      <div class="flex gap-1 mb-2">
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
      </div>
      <p class="text-xs font-semibold text-sp-text mb-1">"<!-- HEADLINE -->"</p>
      <p class="text-xs text-sp-muted"><!-- BODY --></p>
    </div>
    <div class="bg-sp-surface border border-sp-border rounded-xl p-3">
      <div class="flex gap-1 mb-2">
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
        <i data-lucide="star" class="w-3 h-3 text-gray-300"></i>
      </div>
      <p class="text-xs font-semibold text-sp-text mb-1">"<!-- HEADLINE -->"</p>
      <p class="text-xs text-sp-muted"><!-- BODY --></p>
    </div>
  </div>
</div>

<!-- 5. TECHNOLOGY PILLS -->
<div class="mb-6">
  <p class="text-xs font-bold text-sp-muted uppercase tracking-widest mb-2.5">Built-in Technologies</p>
  <div class="flex flex-wrap gap-1.5">
    <!-- Repeat for each technology -->
    <span class="text-xs bg-sp-card border border-sp-border text-sp-text px-2.5 py-1 rounded-full font-medium"><!-- TECH 1 --></span>
    <span class="text-xs bg-sp-card border border-sp-border text-sp-text px-2.5 py-1 rounded-full font-medium"><!-- TECH 2 --></span>
    <span class="text-xs bg-sp-card border border-sp-border text-sp-text px-2.5 py-1 rounded-full font-medium"><!-- TECH 3 --></span>
  </div>
</div>

<!-- 6. FOOTER -->
<div class="flex items-center justify-between">
  <div class="flex items-center gap-1.5 text-xs text-sp-muted">
    <i data-lucide="package" class="w-3.5 h-3.5"></i>
    Genuine Product · Ships from Japan
  </div>
  <div class="text-xs text-sp-dim"><!-- SOURCE URL --></div>
</div>

</div>
</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
