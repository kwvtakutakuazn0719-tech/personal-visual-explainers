<!--
  メイン画像テンプレート（1200×1200px・1:1）
  ============================================================
  AI が main-image-{slug}.html を生成する際の構成見本。生成時は本コメントをすべて除去すること。

  ■ 固定レイアウト（全商品共通）
    - `body` 直下に **`.artboard`** を置き、`html` / `body` / `.artboard` を **1200×1200 固定**にする。
    - **`.artboard` は外枠フレーム込み**のアートボード。Shopee の `main-image` では常に外枠フレームを出す。
    - スクリーンショットは **`.artboard` を選択して `Capture node screenshot`** を使う。`Capture full size screenshot` はビューポート幅ぶんの余白を含みやすい。
    - ルート **`#shopee-main-canvas`** は **フレームの内側キャンバス**として配置する。外枠だけ追加し、内側の座標を古い 800 基準のまま残さない。
    - 各ブロックは **絶対配置**にする。値はピクセル直書きではなく、**内側キャンバス全体に対する比率**で置く。
    - **必須**: ヒーロー、キャッチ帯、右列、ギャラリー、フッターなどの**主要な色面どうしを直接接触させない**。`#shopee-main-canvas` の白地を細いガターとして見せ、**ごく小さい余白**で必ず分離する。
    - **必須**: 上記の主要ブロックは**角を少しだけ丸める**。丸みは控えめでよいが、角が尖ったベタ面に戻さない。
    - ガター幅と角丸は **CSS 変数で共通管理**し、商品ごとに場当たり的な値を混在させない。
    - 800基準の比率:
      - Hero: `height:12%`
      - Catch band: `top:12%; width:76.25%; height:7.75%`
      - Main image area: `top:19.75%; width:76.25%; height:51.5%`
      - Right feature rail: `top:12%; left:76.25%; width:23.75%; height:59.25%`
      - Gallery: `top:71.25%; width:100%; height:18.5%`
      - Footer: `top:89.75%; width:100%; height:10.25%`

  ■ 下段ギャラリー（Section 3）
    - variation-total==1 かつ画像1枚のみ → **Section 3 ごと省略**。そのときメイン画像は `top:19.75%; height:70%`、右列は `top:12%; height:77.75%` に変更する。
    - 上記の省略時も、**メイン画像・右列・ヒーロー・フッターの白ガターと控えめな角丸は維持**する。
    - それ以外の省略・Others・01/02の重複禁止・ラベル区分などは従来どおり（必要なら shopee-generation-ssot.md を参照）。

  ■ フッター・ヒーロー・配色・短語の根拠
    - フィーチャー右列は短文のみ（創作ニュアンス禁止）。
-->
<!DOCTYPE html>
<html lang="en" style="color-scheme:light; background:#FFFFFF;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title><!-- 商品名 --> - Main Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sp: {
              bg: '#FFFFFF', surface: '#F9FAFB', card: '#F3F4F6',
              border: '#E5E7EB', text: '#111827', muted: '#6B7280',
              dim: '#9CA3AF', dark: '#1F2937', positive: '#059669',
              warning: '#D97706', negative: '#DC2626', blue: '#1D4ED8',
              'blue-light': '#EFF6FF', 'blue-mid': '#DBEAFE',
              orange: '#EA580C', 'orange-light': '#FFF7ED',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    :root {
      --frame-size: 16px;
      --frame-color: #555A2B;
      --section-gap: 8px;
      --section-gap-half: 4px;
      --section-gap-onehalf: 12px;
      --section-gap-double: 16px;
      --section-radius: 12px;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background: #FFFFFF;
    }
    * { box-sizing: border-box; }
    .artboard {
      width: 1200px;
      height: 1200px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--frame-color);
      position: relative;
    }
    #shopee-main-canvas {
      position: absolute;
      inset: var(--frame-size);
      overflow: hidden;
      background: #FFFFFF;
    }
  </style>
</head>
<body class="text-sp-text antialiased">
  <div class="artboard">
    <div id="shopee-main-canvas">

      <div class="bg-sp-dark text-white" style="position:absolute; top:var(--section-gap); left:var(--section-gap); width:calc(100% - var(--section-gap-double)); height:calc(12% - var(--section-gap)); padding:0 3.5%; display:flex; align-items:center; overflow:hidden; border-radius:var(--section-radius);">
        <div class="flex items-center justify-between gap-6 w-full min-w-0">
          <div>
            <p class="font-black uppercase text-white leading-none" style="font-size:27px; letter-spacing:0.25em;"><!-- BRAND --></p>
            <h1 class="font-black leading-tight tracking-tight text-white mt-1" style="font-size:48px; line-height:1.1;"><!-- 商品名 --></h1>
            <p class="text-gray-200 mt-1.5" style="font-size:24px; font-weight:800;"><!-- カテゴリ --></p>
          </div>
          <div class="flex flex-col items-end gap-3 flex-shrink-0">
            <span class="font-bold px-6 py-2.5 rounded-full bg-blue-600 text-white" style="font-size:22px;">Men's</span>
            <div class="flex gap-2">
              <span class="px-5 py-1.5 rounded-full border border-gray-500 text-gray-100" style="font-size:20px; font-weight:800;"><!-- TAG 1 --></span>
            </div>
          </div>
        </div>
      </div>

      <div style="position:absolute; top:calc(12% + var(--section-gap)); left:var(--section-gap); width:calc(76.25% - var(--section-gap-onehalf)); height:calc(7.75% - var(--section-gap)); background:#1E3A8A; display:flex; align-items:center; padding:0 2.5%; border-radius:var(--section-radius); overflow:hidden;">
        <p style="color:#FFFFFF; font-size:30px; font-weight:900; line-height:1.2; letter-spacing:-0.01em;"><!-- キャッチ1行目 --><br>
          <span style="color:#93C5FD;"><!-- キャッチ2行目 --></span></p>
      </div>

      <div style="position:absolute; top:calc(19.75% + var(--section-gap)); left:var(--section-gap); width:calc(76.25% - var(--section-gap-onehalf)); height:calc(51.5% - var(--section-gap-onehalf)); padding:1% 1.5% 0.75% 1.5%; display:flex; border-radius:var(--section-radius);">
        <div class="bg-white border border-sp-border rounded-xl overflow-hidden" style="flex:1; display:flex; align-items:center; justify-content:center;">
          <img src="./variation-01.png" alt="<!-- メイン画像の alt -->"
            style="object-fit:contain; width:100%; height:100%; padding:0;"
            onerror="this.style.display='none';">
        </div>
      </div>

      <div style="position:absolute; top:calc(12% + var(--section-gap)); left:calc(76.25% + var(--section-gap-half)); width:calc(23.75% - var(--section-gap-onehalf)); height:calc(59.25% - var(--section-gap-onehalf)); display:grid; grid-template-rows:1fr 1fr 1fr; gap:var(--section-gap);">
        <div class="border border-sp-border bg-amber-50" style="padding:2%; border-radius:var(--section-radius); overflow:hidden;">
          <div class="h-full w-full flex flex-col items-center justify-center text-center" style="gap:18px;">
            <div class="rounded-2xl flex items-center justify-center" style="width:90px; height:90px; background:#92400E;">
              <i data-lucide="<!-- ICON -->" class="text-white" style="width:45px; height:45px;"></i>
            </div>
            <p class="font-black text-amber-900 leading-tight" style="font-size:26px; letter-spacing:-0.01em;"><!-- FEATURE 1 WORD --></p>
          </div>
        </div>
        <div class="border border-sp-border bg-blue-50" style="padding:2%; border-radius:var(--section-radius); overflow:hidden;">
          <div class="h-full w-full flex flex-col items-center justify-center text-center" style="gap:18px;">
            <div class="rounded-2xl flex items-center justify-center" style="width:90px; height:90px; background:#1D4ED8;">
              <i data-lucide="<!-- ICON -->" class="text-white" style="width:45px; height:45px;"></i>
            </div>
            <p class="font-black text-blue-900 leading-tight" style="font-size:26px; letter-spacing:-0.01em;"><!-- FEATURE 2 WORD --></p>
          </div>
        </div>
        <div class="border border-sp-border bg-green-50" style="padding:2%; border-radius:var(--section-radius); overflow:hidden;">
          <div class="h-full w-full flex flex-col items-center justify-center text-center" style="gap:18px;">
            <div class="rounded-2xl flex items-center justify-center" style="width:90px; height:90px; background:#059669;">
              <i data-lucide="<!-- ICON -->" class="text-white" style="width:45px; height:45px;"></i>
            </div>
            <p class="font-black text-green-900 leading-tight" style="font-size:26px; letter-spacing:-0.01em;"><!-- FEATURE 3 WORD --></p>
          </div>
        </div>
      </div>

      <!-- variation-total==1 かつ画像1枚のみのときは本ブロックごと出力しない。その場合も white gutter を保ちつつ、メイン画像は top:calc(19.75% + var(--section-gap)) / height:calc(70% - var(--section-gap-onehalf))、右列は top:calc(12% + var(--section-gap)) / height:calc(77.75% - var(--section-gap-onehalf)) に変更 -->
      <div style="position:absolute; top:calc(71.25% + var(--section-gap-half)); left:var(--section-gap); width:calc(100% - var(--section-gap-double)); height:calc(18.5% - var(--section-gap)); background:#FFFFFF; padding:0 0 1.25%; display:flex; gap:0.75%; border-radius:var(--section-radius);">
        <div class="bg-white border border-sp-border rounded-xl overflow-hidden flex-1 min-w-0" style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:0.65%;">
          <img src="./variation-02.png"
            style="object-fit:contain; flex:1; width:100%; min-height:0; padding:0;"
            onerror="this.style.display='none';">
          <p class="text-sp-muted text-center" style="font-size:21px; font-weight:900; flex-shrink:0;"><!-- NAME --></p>
        </div>
        <div class="bg-white border border-sp-border rounded-xl overflow-hidden flex-1 min-w-0" style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:0.65%;">
          <img src="./variation-03.png"
            style="object-fit:contain; flex:1; width:100%; min-height:0; padding:0;"
            onerror="this.style.display='none';">
          <p class="text-sp-muted text-center" style="font-size:21px; font-weight:900; flex-shrink:0;"><!-- NAME --></p>
        </div>
        <div class="bg-white border border-sp-border rounded-xl overflow-hidden flex-1 min-w-0" style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:0.65%;">
          <img src="./variation-04.png"
            style="object-fit:contain; flex:1; width:100%; min-height:0; padding:0;"
            onerror="this.style.display='none';">
          <p class="text-sp-muted text-center" style="font-size:21px; font-weight:900; flex-shrink:0;"><!-- NAME --></p>
        </div>
        <div class="flex flex-col items-center justify-center bg-sp-card border border-sp-border rounded-xl" style="width:20%; flex-shrink:0;">
          <p class="font-black text-sp-dark leading-none" style="font-size:60px;">+N</p>
          <p class="text-sp-muted font-semibold mt-1" style="font-size:20px;">more [label]</p>
        </div>
      </div>

      <div class="border border-sp-border bg-white" style="position:absolute; top:calc(89.75% + var(--section-gap-half)); left:var(--section-gap); width:calc(100% - var(--section-gap-double)); height:calc(10.25% - var(--section-gap-onehalf)); padding:0 2%; display:flex; align-items:center; overflow:hidden; border-radius:var(--section-radius);">
        <div class="grid grid-cols-3 gap-5 w-full">
          <div class="flex items-start gap-4">
            <i data-lucide="package-check" class="text-sp-positive flex-shrink-0 mt-1" style="width:33px; height:33px;"></i>
            <div>
              <p class="font-extrabold text-sp-text leading-snug" style="font-size:23px;">Genuine Product</p>
              <p class="text-sp-muted leading-snug mt-1" style="font-size:20px;">Ships from Japan</p>
            </div>
          </div>
          <div class="flex items-start gap-4 border-l border-sp-border pl-5">
            <i data-lucide="<!-- ICON -->" class="text-sp-blue flex-shrink-0 mt-1" style="width:33px; height:33px;"></i>
            <div>
              <p class="font-extrabold text-sp-text leading-snug" style="font-size:23px;"><!-- 中央タイトル --></p>
              <p class="text-sp-muted leading-snug mt-1" style="font-size:20px;"><!-- 中央サブテキスト --></p>
            </div>
          </div>
          <div class="flex items-start gap-4 border-l border-sp-border pl-5">
            <i data-lucide="<!-- ICON -->" class="text-sp-positive flex-shrink-0 mt-1" style="width:33px; height:33px;"></i>
            <div>
              <p class="font-extrabold text-sp-text leading-snug" style="font-size:23px;"><!-- 右タイトル --></p>
              <p class="text-sp-muted leading-snug mt-1" style="font-size:20px;"><!-- 右サブテキスト --></p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
