# Shopee 出品候補の「毎日 06:00 JST」キック用の雛形。
# JST = UTC+9 のため、JST 06:00 は前日 UTC 21:00 に相当する。
# 毎日 JST 06:00:
#   1) タブとヘッダを冪等で維持（bootstrap）
#   2) scope → ledger（Jina Reader + 任意 PA-API で突合）
#   3) 本日分のダイジェスト（Job Summary + 任意 Slack）

name: shopee-candidate-discovery-daily

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 UTC 21:00 = 翌日 JST 06:00
  workflow_dispatch: {}

jobs:
  kick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Bootstrap spreadsheet (tabs + headers)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run shopee-sheet:bootstrap

      - name: Import new rows from scope to ledger (J phase 1)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AMAZON_PA_API_ACCESS_KEY: ${{ secrets.AMAZON_PA_API_ACCESS_KEY }}
          AMAZON_PA_API_SECRET_KEY: ${{ secrets.AMAZON_PA_API_SECRET_KEY }}
          AMAZON_ASSOCIATES_PARTNER_TAG: ${{ secrets.AMAZON_ASSOCIATES_PARTNER_TAG }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm run shopee-candidate:discover-from-scope

      - name: Daily digest (cards + Slack optional)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AMAZON_PA_API_ACCESS_KEY: ${{ secrets.AMAZON_PA_API_ACCESS_KEY }}
          AMAZON_PA_API_SECRET_KEY: ${{ secrets.AMAZON_PA_API_SECRET_KEY }}
          AMAZON_ASSOCIATES_PARTNER_TAG: ${{ secrets.AMAZON_ASSOCIATES_PARTNER_TAG }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run shopee-candidate:daily-digest
